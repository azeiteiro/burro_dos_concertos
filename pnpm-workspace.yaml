packages:
  - web

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  re2: true
  unrs-resolver: true
  '@prisma/client': true
  puppeteer: false

minimumReleaseAgeExclude:
  - '@hono/node-server@1.19.13'
  - esbuild@0.28.1
  - form-data@4.0.6
  - js-yaml@4.1.2 || 4.3.1
  - '@babel/core@7.29.1'
  - undici@7.28.0
  - tar@7.5.21
  - deepmerge-ts@8.0.0

overrides:
  '@hono/node-server@<1.19.13': ^1.19.13
  deepmerge-ts@<8.0.0: ^8.0.0
  hono@<4.11.10: '>=4.11.10'
  hono@<4.11.7: '>=4.11.7'
  js-yaml@<=4.1.1: ^4.1.2
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  lodash@>=4.0.0 <=4.17.22: '>=4.17.23'
  minimatch@<10.2.1: '>=10.2.1'
