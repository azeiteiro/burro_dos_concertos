name: Deploy Staging to Digital Ocean

permissions:
  contents: read

on:
  push:
    branches:
      - master # Deploy staging on every push to master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: |
          pnpm store prune
          pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Run tests (Backend)
        run: pnpm test:ci
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          NODE_ENV: test

      - name: Run tests (Web)
        run: cd web && npm test -- --run

      - name: Build Web App (test)
        run: cd web && npm run build

  deploy:
    name: Deploy to NAS
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3 # use the same version/args as in pdc_bot's workflow
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-dns=false

      - name: Deploy to NAS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          script: sudo /volume1/docker/telegram_bots/burro_dos_concertos/staging/deploy.sh
